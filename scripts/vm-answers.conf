# Answers the VM test gives in place of you. Edit, then: vm-test.sh run
# These are the same answers a real install saves to ~/.install-config.
# Nothing here is a secret: the VM uses the fixed test password below
# for its disks, root and user, and is refused on real hardware.

AUTO=1
AUTO_PASS=rebuild-vm-test

HOSTNAME=dreamvm
USERNAME=tester

# Extra desktops on the login screen: none, or a list such as plasma,gnome
# See them all with: bash scripts/desktop.sh catalog
WANT_DESKTOPS=plasma

WANT_CHAOTIC_REMOVE=yes

# Self hosting. One small service keeps the test short; "all" tests them all.
WANT_DOCKER=yes
WANT_STACKS=searxng

WANT_TAILSCALE=no
WANT_OLLAMA=no
WANT_SUNSHINE=no
WANT_LIBREWOLF=yes

# Connection watcher (OpenSnitch) and firewall window (Gufw)
WANT_WATCH=yes
