services:

  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: "no"
    user: "${WANTED_UID:-1000}:${WANTED_GID:-1000}"
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - ${MEDIA_DIR}:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=http://127.0.0.1:8096
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
