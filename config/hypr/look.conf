# Ai - the look, from config/theme.env

general {
	gaps_in = ${GAP}
	gaps_out = ${GAP_OUT}
	border_size = ${BORDER}
	col.active_border = rgb(${ACCENT_RAW})
	col.inactive_border = rgb(${OVERLAY_RAW})
}

decoration {
	rounding = ${RADIUS}
}

misc {
	disable_hyprland_logo = true
	force_default_wallpaper = 0
	background_color = rgb(${BG_RAW})
}
