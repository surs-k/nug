services:

  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: invidious
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "${BIND_INVIDIOUS:-127.0.0.1}:3000:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${DB_PASSWORD}
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://invidious-companion:8282"
        invidious_companion_key: "${COMPANION_KEY}"
        hmac_key: "${HMAC_KEY}"
        external_port: 3000
        domain:
        https_only: false
        popular_enabled: false
        statistics_enabled: false
        registration_enabled: false
        login_enabled: false
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit 1
      interval: 5m
      timeout: 10s
      retries: 2
    depends_on:
      - invidious-db
      - invidious-companion
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  invidious-companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: invidious-companion
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: "${COMPANION_KEY}"
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companion-cache:/var/tmp/youtubei.js:rw
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  invidious-db:
    image: docker.io/library/postgres:14
    container_name: invidious-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - invidious-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  invidious-db:
  companion-cache:
