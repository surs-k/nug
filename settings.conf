# Ai - settings
#      the facts about you and this PC that the install uses
#      change a line here, then run the install or `rebuild` again
#      everything is plain shell, NAME="value"

# Ai - who and where
#      hostname is also the name the laptop looks for on the tailnet
HOSTNAME_DEFAULT="hollowtower"
TIMEZONE="America/New_York"
LOCALE="en_US.UTF-8"

# Ai - keyboard, for the console and the desktop
#      KEYMAP is the console name, the XKB pair is the desktop one
KEYMAP="colemak"
XKB_LAYOUT="us"
XKB_VARIANT="colemak"

# Ai - disk encryption cost, pinned rather than benchmarked
#      256 MiB of memory, see decisions.md for why
LUKS_MEMORY_KIB="262144"

# Ai - boot menu wait in seconds, hold any key at start to see it with 0
BOOT_TIMEOUT="2"

# Ai - where the install repo lives in your home, Changes reads it there too
REPO_DIR_NAME="rebuild"

# Ai - the side screen stands on end: 1 turns it 90 degrees, 3 turns it 270
ROTATE="3"
