# Ai - every known problem with the install, the Problems tab in Changes reads this
#      check is a shell line run as you, never as root, it only reads
#      exit 0 means the problem is on this PC, 1 means it is not, anything
#      else means it could not tell, what it prints is shown as what it found
#      a problem with no check is part of v1's design, and v2 fixes it
#      a change fixes a problem by naming its id on its Problems: line

[[problem]]
id = "secure-boot"
title = "Secure Boot is off"
area = "Security"
quiet = true
means = "Someone with your PC in hand can change what starts before your disk password is asked."
v2 = "Phase 1: Secure Boot on, with your own keys."
check = '''
f=$(ls /sys/firmware/efi/efivars/SecureBoot-* 2> /dev/null | head -n 1)
[ -n "$f" ] || exit 2
[ "$(od -An -t u1 "$f" | awk '{print $NF}')" = 1 ] && exit 1
exit 0
'''

[[problem]]
id = "tpm-pin"
title = "The disk unlocks by itself, no PIN"
area = "Security"
quiet = true
means = "A stolen PC starts all the way to the login screen without your disk password."
v2 = "Phase 1: the TPM asks for a PIN, or the disk password is used alone."
check = '''
[ -e /dev/tpmrm0 ] || exit 1
echo "A TPM is in this PC, and v1 set it to unlock the disk without a PIN."
exit 0
'''

[[problem]]
id = "boot-editor"
title = "Boot entries can be edited at startup"
area = "Security"
quiet = true
means = "Anyone at the keyboard can change how the system starts, for example to skip the login."
v2 = "Phase 1: the boot editor is turned off."

[[problem]]
id = "open-ports"
title = "Something accepts connections from your network"
area = "Privacy"
quiet = true
means = "A program on this PC can be reached by other devices on your network, not just by you."
now = "Copy what was found into a Claude chat and ask what it is."
v2 = "Phase 2: one firewall owner, every service bound to this PC or the tailnet only."
check = '''
command -v ss > /dev/null || exit 2
out=$(ss -Hltun 2> /dev/null | awk '{print $1, $5}' \
	| grep -vE ' (127\.|\[::1\]|100\.|\[fd7a:115c)' \
	| grep -vE ':(68|546|5353)$')
[ -n "$out" ] || exit 1
printf '%s\n' "$out"
exit 0
'''

[[problem]]
id = "firewall-off"
title = "The firewall is not running"
area = "Security"
quiet = true
means = "Anything listening on this PC can be reached from your network."
now = "sudo systemctl enable --now ufw"
check = '''
command -v ufw > /dev/null || exit 2
systemctl is-active --quiet ufw && exit 1
exit 0
'''

[[problem]]
id = "vpn-off"
title = "The VPN is not connected"
area = "Privacy"
quiet = true
means = "Your internet provider sees every site you visit."
now = "Open Mullvad from the tray and connect."
check = '''
command -v mullvad > /dev/null || exit 2
mullvad status 2> /dev/null | grep -q '^Connected' && exit 1
exit 0
'''

[[problem]]
id = "stash"
title = "Reinstall stash left on disk"
area = "Privacy"
quiet = true
means = "Service passwords, SSH keys and your Mullvad number are still saved from a reinstall."
now = "If you are not in the middle of a reinstall: sudo rm -r ~/.rebuild/stash"
v2 = "Phase 1: settings that must survive a reinstall live on the data disk, no stash."
check = '''
[ -e "$HOME/.rebuild/stash" ] && exit 0
exit 1
'''

[[problem]]
id = "ufw-docker"
title = "A downloaded script rewrites the firewall"
area = "Security"
quiet = true
means = "ufw-docker was fetched as root straight from someone's GitHub, and it edits your firewall rules."
v2 = "Phase 4: dropped, the services do not need it."
check = '''
[ -e /usr/local/bin/ufw-docker ] && exit 0
exit 1
'''

[[problem]]
id = "input-group"
title = "Your user can read every keyboard"
area = "Security"
quiet = true
means = "Any program you run can read every key you press, passwords included. Sunshine was given this."
v2 = "Phase 3: Sunshine set up without it."
check = '''
id -nG | tr ' ' '\n' | grep -qx input && exit 0
exit 1
'''

[[problem]]
id = "unpinned"
title = "Updates are not pinned"
area = "Security"
quiet = true
means = "HyDE, AUR packages and Docker images update to whatever is newest, untested by anyone you trust."
v2 = "Phase 2: an update policy, tested versions only for the risky ones."

[[problem]]
id = "dns-owners"
title = "Four programs manage DNS"
area = "Privacy"
quiet = true
means = "It is unclear who sees which sites you look up, and lookups have stalled before."
v2 = "Phase 2: one owner for DNS."

[[problem]]
id = "backup-unmounted"
title = "The backup drive is not mounted"
area = "Recovery"
quiet = true
means = "Daily backups go nowhere, or onto the system disk, which filled up once."
now = "sudo mount /mnt/backup"
v2 = "Phase 2: backups refuse to run without their drive."
check = '''
grep -q ' /mnt/backup ' /etc/fstab 2> /dev/null || exit 1
mountpoint -q /mnt/backup && exit 1
exit 0
'''

[[problem]]
id = "header-backup"
title = "No copy of the disk encryption headers"
area = "Recovery"
quiet = true
means = "If the start of an encrypted disk is damaged, everything on it is lost, even with your password."
v2 = "Phase 2: header copies kept with the backups."

[[problem]]
id = "restore-test"
title = "Backups have never been restored as a test"
area = "Recovery"
quiet = true
means = "Nobody knows yet whether a backup can actually bring your files back."
v2 = "Phase 2: a restore test, then one every few months."

[[problem]]
id = "nofail"
title = "A missing disk stops startup"
area = "Recovery"
quiet = false
means = "If a data or backup disk is unplugged or fails, the PC stops at an emergency screen."
v2 = "Phase 1: every disk but the system disk is optional at startup."
check = '''
[ -r /etc/fstab ] || exit 2
root=$(awk '$1 !~ /^#/ && $2 == "/" {print $1}' /etc/fstab)
out=$(awk -v r="$root" '$1 !~ /^#/ && NF >= 4 && $1 != r && $2 != "/boot" && $3 !~ /^(swap|tmpfs)$/ && $4 !~ /nofail/ {print $2}' /etc/fstab)
[ -n "$out" ] || exit 1
printf 'without nofail: %s\n' $out
exit 0
'''

[[problem]]
id = "keep-default"
title = "The installer offers to erase the data disk by default"
area = "Recovery"
quiet = false
means = "Pressing Enter at the wrong question leads toward wiping your 2TB data disk. A typed YES still guards it."
v2 = "Phase 1: keeping the data disk is the default."

[[problem]]
id = "reboot-needed"
title = "A new kernel is waiting for a reboot"
area = "Management"
quiet = true
means = "Docker, virtual machines and new USB devices can fail until you restart."
now = "Restart the PC."
check = '''
[ -d "/usr/lib/modules/$(uname -r)" ] && exit 1
echo "running $(uname -r), its modules were replaced by an update"
exit 0
'''

[[problem]]
id = "boot-entries"
title = "Duplicate boot entries in the firmware"
area = "Management"
quiet = true
means = "Each reinstall adds another boot entry, and old ones can start a system that no longer exists."
v2 = "Phase 1: the installer replaces its entry instead of adding one."
check = '''
command -v efibootmgr > /dev/null || exit 2
out=$(efibootmgr 2> /dev/null) || exit 2
d=$(printf '%s\n' "$out" | sed -n 's/^Boot[0-9A-F]\{4\}\*\{0,1\} //p' | sed 's/\t.*//' | sort | uniq -d)
[ -n "$d" ] || exit 1
printf 'more than once: %s\n' "$d"
exit 0
'''

[[problem]]
id = "tailnet-nodes"
title = "Each reinstall adds a new Tailscale device"
area = "Management"
quiet = true
means = "Old copies of this PC stay in your tailnet, and the laptop can find the wrong one."
now = "Remove old copies at login.tailscale.com, under Machines."
v2 = "Phase 3: the device identity survives a reinstall."

[[problem]]
id = "keys-skipped"
title = "Some keys open apps that were skipped"
area = "Visuals"
quiet = false
means = "SUPER+C and SUPER+R are set even when Claude or Obsidian is not installed, and VSCodium has no key."
v2 = "Phase 5: a key exists only while its app does."

[[problem]]
id = "guides-missing"
title = "The scripts point to guides that do not exist"
area = "Educating"
quiet = false
means = "Thirteen comments send you to Guides files that were never written."
v2 = "Every phase: the explanation lives in Changes instead."
