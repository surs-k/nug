# Ai - the lock screen: the time, and one box for your password
general {
	hide_cursor = true
	grace = 0
}

background {
	monitor =
	color = rgb(${BG_RAW})
}

label {
	monitor =
	text = $TIME
	color = rgb(${TEXT_RAW})
	font_size = 64
	font_family = ${FONT_UI}
	position = 0, 120
	halign = center
	valign = center
}

input-field {
	monitor =
	size = 320, 52
	outline_thickness = ${BORDER}
	outer_color = rgb(${OVERLAY_RAW})
	inner_color = rgb(${SURFACE_RAW})
	font_color = rgb(${TEXT_RAW})
	check_color = rgb(${ACCENT_RAW})
	fail_color = rgb(${BAD_RAW})
	placeholder_text = Password
	fail_text = Wrong password
	rounding = ${RADIUS}
	dots_size = 0.25
	fade_on_empty = false
	position = 0, -20
	halign = center
	valign = center
}
