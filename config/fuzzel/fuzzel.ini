# Ai - the launcher, type to find an app, Enter opens it
[main]
font=${FONT_UI}:size=${FONT_SIZE}
terminal=kitty
prompt="›  "
width=42
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=8
icon-theme=Papirus-Dark

[colors]
background=${SURFACE_RAW}f5
text=${TEXT_RAW}ff
prompt=${MUTED_RAW}ff
input=${TEXT_RAW}ff
match=${ACCENT_RAW}ff
selection=${OVERLAY_RAW}ff
selection-text=${TEXT_RAW}ff
selection-match=${ACCENT_RAW}ff
border=${ACCENT_RAW}ff

[border]
width=${BORDER}
radius=${RADIUS}
