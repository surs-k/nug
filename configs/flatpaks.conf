# Apps installed as Flatpaks: sandboxed, and removable with all their data.
#
# One app per line:   app id | name | what it is for
# Add a line, then run:   rebuild --only 60-uprefs
# Remove an app and its data: open Warehouse, or
#   flatpak uninstall --delete-data APP_ID
#
# Find ids on https://flathub.org . Prefer apps with the blue "verified"
# tick there: it means the app's own author publishes that Flatpak.
# See and change what an app may touch: open Flatseal.

io.freetubeapp.FreeTube      | FreeTube  | YouTube without an account
dev.vencord.Vesktop          | Vesktop   | Discord
org.kde.krita                | Krita     | drawing and painting
com.github.tchx84.Flatseal   | Flatseal  | see and change what each Flatpak app may touch
io.github.flattool.Warehouse | Warehouse | list Flatpak apps, remove one with all its data

# Installed the Arch way for now, because moving them would hide the
# settings and data they already have in your home folder.
# To move one: uninstall the Arch package, then uncomment its line.
#
# md.obsidian.Obsidian       | Obsidian  | notes (verified on Flathub)
#
# Signal stays an Arch package: its Flatpak is not published by Signal.
