# Ai - the desktop's own keys and start-up, added after Hyprland's example
#      config, so the example's keys stay and only these are changed

input {
	kb_layout = ${XKB_LAYOUT}
	kb_variant = ${XKB_VARIANT}
}

unbind = SUPER, R
bind = SUPER, R, exec, fuzzel
bind = SUPER, Space, exec, fuzzel
bind = SUPER, Return, exec, kitty
unbind = SUPER, E
bind = SUPER, E, exec, dolphin
bind = SUPER, L, exec, loginctl lock-session
bind = SUPER, Escape, exec, nug-power
bind = SUPER, slash, exec, nug-keys
bind = SUPER, N, exec, changes
unbind = SUPER, M
bind = SUPER SHIFT, S, exec, nug-shot

exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent
exec-once = mullvad-vpn
