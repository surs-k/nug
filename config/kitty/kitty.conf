# Ai - the terminal, colours from config/theme.env
font_family ${FONT}
font_size ${FONT_SIZE_TERM}
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam

background ${BG}
foreground ${TEXT}
cursor ${ACCENT}
selection_background ${OVERLAY}
selection_foreground ${TEXT}
url_color ${ACCENT}

color0 ${SURFACE}
color8 ${OVERLAY}
color1 ${BAD}
color9 ${BAD}
color2 ${GOOD}
color10 ${GOOD}
color3 ${WARN}
color11 ${WARN}
color4 ${ACCENT}
color12 ${ACCENT}
color5 #b48ead
color13 #b48ead
color6 #6fb3b8
color14 #6fb3b8
color7 ${MUTED}
color15 ${TEXT}
